<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Contacts - Personal Contact Manager</title>

  <link rel="stylesheet" href="css/style.css?v=20260929">
</head>

<body class="dashboard-page">

  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">C<span>•</span></span><span>Contact Manager<span class="brand-caption">YOUR PEOPLE, IN ONE PLACE</span></span></div>
      <span class="header-label">Your address book</span>
    </div>
  </header>
  <main class="contacts-page">

    <section class="contacts-panel">

      <!-- Header -->
      <div class="contacts-header">

        <div>
          <p class="eyebrow">STAY IN TOUCH</p>
          <h1>My Contacts<span class="heading-dot">.</span></h1>

          <p class="subtitle">
            View and manage your saved contacts.
          </p>
        </div>

        <button
          id="logout-button"
          class="secondary-button"
        >
          Log out
        </button>

      </div>

      <!-- Message Banner -->
      <div
        id="contacts-banner"
        class="banner"
        role="status"
        aria-live="polite"
      ></div>

      <!-- Add/Edit Contact Form -->
      <div
        id="contact-form-container"
        class="contact-form-container hidden"
      >

        <h2 id="contact-form-title">
          Add Contact
        </h2>

        <form id="contact-form">

          <div class="form-grid">

            <div class="field">

              <label for="first-name">
                First Name
              </label>

              <input
                type="text"
                id="first-name"
                required
              >

            </div>

            <div class="field">

              <label for="last-name">
                Last Name
              </label>

              <input
                type="text"
                id="last-name"
                required
              >

            </div>

            <div class="field">

              <label for="email">
                Email
              </label>

              <input
                type="email"
                id="email"
                required
              >

              <span id="email-error" class="field-error"></span>

            </div>

            <div class="field">

              <label for="phone">
                Phone
              </label>

              <input
                type="tel"
                id="phone"
                required
              >

            </div>

          </div>

          <div class="form-actions">

            <button
              type="button"
              id="cancel-contact-button"
              class="secondary-button"
            >
              Cancel
            </button>

            <button
              type="submit"
              class="submit"
            >
              Save Contact
            </button>

          </div>

        </form>

      </div>

      <!-- Search / Add Toolbar -->
      <div class="contacts-toolbar">

        <input
          type="text"
          id="search-input"
          placeholder="Search by name, email, or phone"
          aria-label="Search contacts"
        >

        <button
          id="search-button"
          class="submit"
        >
          Search
        </button>

        <button
          id="add-contact-button"
          class="submit"
        >
          Add Contact
        </button>

      </div>

      <!-- Contacts Table -->
      <div class="contacts-table-wrapper" tabindex="0" role="region" aria-label="Saved contacts">

        <table class="contacts-table">

          <thead>

            <tr>
              <th scope="col">First Name</th>
              <th scope="col">Last Name</th>
              <th scope="col">Email</th>
              <th scope="col">Phone</th>
              <th scope="col">Date Created</th>
              <th scope="col">Actions</th>
            </tr>

          </thead>

          <tbody id="contacts-table-body"></tbody>

        </table>

      </div>

    </section>

  </main>

  <script src="js/contacts.js"></script>

</body>

</html>
