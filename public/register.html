<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Personal Contact Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="subtitle">Start managing your contacts</p>

    <div id="register-banner" class="banner"></div>

    <form id="register-form" novalidate>
      <div class="name-row">
        <div class="field">
          <label for="reg-first">First name</label>
          <input type="text" id="reg-first" name="firstName" autocomplete="given-name" required>
        </div>
        <div class="field">
          <label for="reg-last">Last name</label>
          <input type="text" id="reg-last" name="lastName" autocomplete="family-name" required>
        </div>
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" name="password" autocomplete="new-password" required>
      </div>
      <button type="submit" class="submit">Create account</button>
    </form>

    <p class="switch-link">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
